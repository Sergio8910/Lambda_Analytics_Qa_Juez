[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "outputs/",
    ".venv/",
    "juez/RAGs/",
    "juez/scripts/",
    "verificador/scripts/",
    "**/__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line too long — algunas strings largas son intencionales
    "B008",  # function call in argument defaults (FastAPI Depends/Field)
    "UP007", # Optional[X] vs X | None — usamos Optional por consistencia con Pydantic
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["F401", "F811"]  # unused imports + redefined in fixtures
"**/test_*.py" = ["F401", "F811"]

[tool.ruff.format]
quote-style = "double"
